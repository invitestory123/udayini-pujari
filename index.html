  </head>
  <body>
    <div id="root"></div>

    <!-- Floating Background Music Player -->
    <audio id="wedding-bgm" loop preload="auto" src="./editable/assets/music.mp3"></audio>
    <div id="bgm-container" class="bgm-float-widget">
      <button
        id="bgm-toggle-btn"
        type="button"
        title="Toggle background music"
        aria-label="Toggle background music"
        class="bgm-button"
      >
        <span id="bgm-pulse-ring" class="bgm-pulse"></span>
        <svg id="bgm-icon-playing" class="bgm-icon bgm-spin bgm-hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10"></path>
        </svg>
        <svg id="bgm-icon-paused" class="bgm-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
        </svg>
      </button>
    </div>

    <script>
      (function () {
        const bgm = document.getElementById("wedding-bgm");
        const toggleBtn = document.getElementById("bgm-toggle-btn");
        const iconPlaying = document.getElementById("bgm-icon-playing");
        const iconPaused = document.getElementById("bgm-icon-paused");
        const pulseRing = document.getElementById("bgm-pulse-ring");

        let isPlaying = false;
        let userInteracted = false;

        function updateUI(playing) {
          isPlaying = playing;
          if (playing) {
            iconPlaying.classList.remove("bgm-hidden");
            iconPaused.classList.add("bgm-hidden");
            pulseRing.classList.add("is-active");
          } else {
            iconPlaying.classList.add("bgm-hidden");
            iconPaused.classList.remove("bgm-hidden");
            pulseRing.classList.remove("is-active");
          }
        }

        function playBgm() {
          if (!bgm) return;
          bgm.play().then(() => {
            updateUI(true);
          }).catch((err) => {
            console.log("Audio autoplay prevented:", err);
            updateUI(false);
          });
        }

        function pauseBgm() {
          if (!bgm) return;
          bgm.pause();
          updateUI(false);
        }

        function handleFirstInteraction() {
          if (!userInteracted) {
            userInteracted = true;
            playBgm();
          }
        }

        document.addEventListener("click", handleFirstInteraction, { passive: true });
        document.addEventListener("touchstart", handleFirstInteraction, { passive: true });

        if (toggleBtn) {
          toggleBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            userInteracted = true;
            if (isPlaying) {
              pauseBgm();
            } else {
              playBgm();
            }
          });
        }
      })();
    </script>
  </body>
</html>
